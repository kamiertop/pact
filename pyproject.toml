[project]
name = "pact"
version = "0.1.0"
description = "Advection-consistent modeling for event-based small object detection."
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "numpy>=2.0.0",
    "opencv-python-headless>=4.11.0.86",
    "pandas>=2.3.3",
    "pyyaml>=6.0.2",
    "spconv-cu126>=2.3.8",
    "torch>=2.13.0,<2.14",
    "tqdm>=4.67.0",
]

[project.optional-dependencies]
vis = ["matplotlib>=3.10.0", "open3d>=0.19.0"]

[dependency-groups]
dev = ["ninja>=1.11.1.4", "setuptools>=75"]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple"
default = true
